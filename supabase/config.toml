project_id = "jarins"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Production, not localhost. This is the fallback Supabase puts in an email when
# the requested emailRedirectTo is not allowlisted below — so getting it wrong
# does not fail loudly, it silently mails everyone a link to a dev machine.
site_url = "https://jarins.com"
# The app always asks for /auth/callback?next=<path>, so the exact entry alone
# never matches: the query string has to be covered too. `**` spans separators.
additional_redirect_urls = [
  "https://jarins.com/auth/callback",
  "https://jarins.com/auth/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/**",
]
enable_signup = true

# Everything below restores values that `supabase config push` reset to CLI
# defaults because this file did not declare them. An omitted key does not mean
# "leave the remote alone" — it means "push the default". Anything that matters
# has to be written down here, or the next push quietly weakens it again.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Without this anyone can sign up with an address they do not control, while the
# sign-in screen still promises "Verified email required".
enable_confirmations = true
secure_password_change = false
# Rate limit on auth mail. The CLI default of 1s is an email-bombing gift.
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Identity providers.
#
# Undeclared here means disabled: the CLI default for every external provider is
# `enabled = false`, so a `supabase config push` turns off anything that was
# switched on in the dashboard. Enabling one is therefore a two-part change —
# uncomment its block below, and add the provider to
# NEXT_PUBLIC_AUTH_OAUTH_PROVIDERS in the web build, or the button never renders.
#
# `secret` values are read from the shell, never written here. With each
# provider, register the redirect URI Supabase owns —
# https://<project-ref>.supabase.co/auth/v1/callback — not a jarins.com path:
# the app is only reached afterwards, through additional_redirect_urls above.
#
# Apple additionally requires the Services ID as the client id, and returns the
# person's name exactly once, on the first authorization.

# [auth.external.google]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# skip_nonce_check = false

# [auth.external.apple]
# enabled = true
# client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

# [auth.external.github]
# enabled = true
# client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

# [auth.external.azure]
# enabled = true
# client_id = "env(SUPABASE_AUTH_AZURE_CLIENT_ID)"
# secret = "env(SUPABASE_AUTH_AZURE_SECRET)"
# url = "https://login.microsoftonline.com/common"

[storage]
enabled = true
# Matches the hosted default. Declared so a push cannot lower it.
file_size_limit = "50MiB"
